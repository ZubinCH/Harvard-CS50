<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="/static/styles.css" rel="stylesheet">
        <title>Birthdays</title>
    </head>
    <body>
        <div class="header">
            <h1><strong>Birthdays</strong></h1>
        </div>
        <div class="container">
            <div class="section bg-dark birthday-input" style="border-radius: 12px;">

                <h2 style="font-family: sans-serif; color: #fff;"><strong>Add a birthday</strong></h2>
                <!-- TODO: Create a form for users to submit a name, a month, and a day -->
                 <form action="/" method="POST" style="text-align: left;">
                    <div class="row">
                        <div class="col mb-3">
                            <label for="name_input" class="form-label">Enter a name</label>
                            <input class="form-control input-color" name="name" type="text" placeholder="Name" id="name_input">
                        </div>
                    </div>
                    <br>
                    <div class="row">
                        <div class="col mb-3">
                            <label for="Month" class="form-label">Month</label>
                            <input class="form-control input-color" name="month" type="number" id="Month">
                        </div>
                        <div class="col mb-3">
                            <label for="Day" class="form-label">Day</label>
                            <input class="form-control input-color" name="day" type="number" id="Day">
                        </div>
                    </div>
                    <br>
                    <div class="row">
                        <button style="width: 95%; margin: 0 auto;" type="submit" class="btn btn-secondary">Enter</button>
                    </div>


                 </form>
            </div>
            <br>
            <div class="section">

                <h2>All Birthdays</h2>
                <div class="rounded-3 overflow-auto">
                <table class="table table-striped table-dark mb-0">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Birthday</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- TODO: Loop through the database entries to display them in this table -->
                         {% for person in birthdays %}
                            <tr>
                                <td>{{ person["name"] }}</td>
                                <td>{{ MONTH[person["month"] - 1] }} {{ person["day"] }}</td>
                                <td>
                                    <form action="\remove" method="post">
                                        <input name="id" type="hidden" value='{{ person["id"] }}'>
                                        <button type="submit" class="btn btn-secondary">Remove</button>

                                    </form>
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
    </body>
</html>
