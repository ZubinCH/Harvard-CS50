{% extends "layout.html" %}

{% block body %}
    <h1>Registrants</h1>
    <div class="border rounded-3 overflow-auto">
        <table class="table table-striped mb-0">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Sport</th>
                </tr>
            </thead>
            <tbody>
                {% for name in registrants %}
                    <tr>
                        <td>{{ name }}</td>
                        <td>{{ registrants[name] }}</td>
                    </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>


{% endblock %}
