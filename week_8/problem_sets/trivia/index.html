<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section" id="partA">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <!-- TODO: Add multiple choice question here -->

                <h3>Which planet has the shortest day in our Solar system?</h3>
                <button>Neptune</button>
                <button>Mercury</button>
                <button>Jupiter</button>
                <button>Mars</button>
                <p></p>

            </div>

            <div class="section" id="partB">
                <h2>Part 2: Free Response</h2>
                <hr>
                <!-- TODO: Add free response question here -->
                 <form>
                    <h3>What is the capital city of France?</h3>
                    <input type="text" placeholder="Type" autocomplete="off">
                    <input type="submit">
                 </form>
                 <p></p>
            </div>
        </div>


        <script>
            // TODO: Add code to check answers to questions

            const partA = document.getElementById('partA');
            partA.addEventListener('click', (event) => {
                html = ``;
                const button = event.target.closest('button');

                if (!button) return;

                if (button.textContent === 'Jupiter') {
                    button.style.backgroundColor = 'green';
                    html = `Correct!`;
                }
                else {
                    button.style.backgroundColor = 'red';
                    html = `Incorrect`;
                }
    
                partA.querySelector('p').textContent = html;
            });

            const partB = document.getElementById('partB');
            partB.querySelector('form').addEventListener('submit', function(event) {
                event.preventDefault();
    
                let answer = document.querySelector('input[type="text"').value.trim().toLowerCase();
                let html = ``;
                if (answer === 'paris') {
                    html = `Correct!`;
                }
                else {
                    html = `Incorrect`;
                }

                partB.querySelector('p').textContent = html;

            });


        </script>
    </body>
</html>
